name: Docker Image CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build:
    runs-on: euleros-2.10.1
    steps:
      - uses: checkout-action@0.0.1
      - name: Install Docker
        run: |
          set -euo pipefail

          echo "=== Check if Docker is already installed ==="
          if command -v docker >/dev/null 2>&1; then
            echo "Docker already installed: $(docker --version)"
            exit 0
          fi

          echo "=== OS detection ==="
          cat /etc/os-release 2>/dev/null || true

          echo "=== Existing yum repos ==="
          ls -la /etc/yum.repos.d/ 2>/dev/null || true
          for f in /etc/yum.repos.d/*.repo; do
            if [ -f "$f" ]; then
              echo "--- $f ---"
              cat "$f"
            fi
          done

          echo "=== Fix yum shebang: find python3.7 ==="
          PY37_BIN=""
          for p in /usr/bin/python3.7 /usr/bin/python37; do
            if [ -x "$p" ]; then
              echo "  found: $p ($($p --version 2>&1))"
              PY37_BIN="$p"
              break
            fi
          done
          if [ -z "$PY37_BIN" ]; then
            echo "  ERROR: no python3.7 found"
            exit 1
          fi

          echo "=== Test yum with existing repos ==="
          if $PY37_BIN /bin/yum repolist 2>&1; then
            echo "  existing repos are working!"
          else
            echo "  existing repos not working, trying to override..."
            # Try to write repo via sudo, or into an alternative location
            if command -v sudo >/dev/null 2>&1; then
              sudo bash -c "cat > /etc/yum.repos.d/euleros.repo" <<'REPOEOF'
[base]
name=EulerOS-2.0-base
baseurl=https://mirrors.huaweicloud.com/euler/2.10/os/x86_64/
enabled=1
gpgcheck=0
REPOEOF
              $PY37_BIN /bin/yum repolist 2>&1 || true
            fi

            echo "  also trying existing repo directly..."
            $PY37_BIN /bin/yum --disablerepo='*' --enablerepo='base' repolist 2>&1 || true
          fi

          echo "=== Install Docker ==="
          if $PY37_BIN /bin/yum install -y docker docker-engine 2>&1; then
            echo "  docker installed via yum"
          else
            echo "  yum install failed, trying rpm direct download..."
            # Direct download docker RPMs as fallback
            DOCKER_RPM="https://mirrors.huaweicloud.com/docker-ce/linux/centos/7/x86_64/stable/Packages/docker-ce-24.0.7-1.el7.x86_64.rpm"
            curl -fsSL -o /tmp/docker.rpm "$DOCKER_RPM" 2>&1 && {
              rpm -ivh /tmp/docker.rpm 2>&1 || true
            }
          fi

          if command -v docker >/dev/null 2>&1; then
            echo "=== Docker installed successfully: $(docker --version) ==="
          else
            echo "=== TIP: docker binary not found, but check dockerd ==="
            ls /usr/bin/docker* 2>/dev/null || echo "  no docker binaries found"
            echo "=== ERROR: Docker still not available ==="
            exit 1
          fi
      - name: Build the Docker image
        run: |
          set -euo pipefail
          echo "=== Docker version ==="
          docker version 2>&1 || true
          echo "=== Building test image ==="
          mkdir -p /tmp/docker-test
          cat > /tmp/docker-test/Dockerfile <<'EOF'
          FROM alpine:3.20
          RUN echo "Docker CI is working!"
          CMD ["echo", "Hello from Docker Image CI"]
          EOF
          docker build -f /tmp/docker-test/Dockerfile -t my-image-name:$(date +%s) /tmp/docker-test
          echo "=== Docker image built successfully ==="
