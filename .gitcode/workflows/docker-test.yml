name: Podman Signing Service Test

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  podman-test:
    runs-on: euleros-2.10.1
    steps:
      - name: Setup Podman
        run: |
          set -euo pipefail

          if command -v podman >/dev/null 2>&1; then
            echo "Podman already installed: $(podman --version)"
            exit 0
          fi

          echo "=== OS ===" && cat /etc/os-release | head -3 || true

          # Try yum/dnf first (EulerOS repos should have podman)
          echo "=== Attempt yum/dnf install podman ==="
          PY37_BIN=""
          for p in /usr/bin/python3.7 /usr/bin/python37; do
            [ -x "$p" ] && PY37_BIN="$p" && break
          done
          if [ -n "$PY37_BIN" ]; then
            # Try default repos first
            $PY37_BIN /bin/yum install -y podman 2>&1 && echo "Podman installed via yum!" || true
            # Fallback: override repo to Huawei mirror
            if ! command -v podman >/dev/null 2>&1; then
              echo "  trying with Huawei EulerOS mirror..."
              $PY37_BIN /bin/yum install -y podman \
                --setopt="*.baseurl=https://mirrors.huaweicloud.com/euler/2.10/os/x86_64/" \
                --setopt="*.gpgcheck=0" 2>&1 && echo "Podman installed via Huawei mirror!" || true
            fi
            # Fallback: CentOS 7 EPEL mirror (compatible with EulerOS)
            if ! command -v podman >/dev/null 2>&1; then
              echo "  trying with CentOS 7 + EPEL mirrors..."
              $PY37_BIN /bin/yum install -y podman \
                --setopt="*.baseurl=https://mirrors.huaweicloud.com/centos/7/os/x86_64/" \
                --setopt="*.gpgcheck=0" \
                --enablerepo="*" 2>&1 && echo "Podman installed via CentOS mirror!" || true
            fi
          fi

          # Fallback: download static binary from OBS
          if ! command -v podman >/dev/null 2>&1; then
            echo "=== Downloading Podman static binary ==="
            # Primary: project OBS mirror (fast on Huawei Cloud)
            # Fallback: GitHub proxy mirrors
            PODMAN_OBS="https://xuanwu-rust.obs.cn-north-4.myhuaweicloud.com/dist/podman-linux-amd64-v4.7.1.tar.gz"
            MIRRORS="
              $PODMAN_OBS
              https://mirror.ghproxy.com/https://github.com/mgoltzsche/podman-static/releases/download/v4.7.1/podman-linux-amd64.tar.gz
              https://ghproxy.net/https://github.com/mgoltzsche/podman-static/releases/download/v4.7.1/podman-linux-amd64.tar.gz
            "
            DOWNLOADED=false
            for url in $MIRRORS; do
              echo "  trying: $url"
              if curl -fsSL --connect-timeout 10 --max-time 120 -o /tmp/podman.tar.gz "$url" 2>&1; then
                echo "  download OK!"
                DOWNLOADED=true
                break
              fi
              echo "  failed, trying next..."
            done

            if [ "$DOWNLOADED" = true ]; then
              mkdir -p /tmp/podman
              tar xzf /tmp/podman.tar.gz -C /tmp/podman --strip-components=1 2>/dev/null || \
                tar xzf /tmp/podman.tar.gz -C /tmp/podman
              find /tmp/podman -name podman -type f -exec chmod +x {} \;
              export PATH="/tmp/podman:/tmp/podman/usr/local/bin:$PATH"
              echo "  podman binary: $(which podman 2>/dev/null || echo NOT FOUND)"
            fi
          fi

          if command -v podman >/dev/null 2>&1; then
            echo "=== Podman version ==="
            podman --version
            podman info 2>&1 | head -10 || true
            echo "RESULT: Podman ready ✅"
          else
            echo "RESULT: Podman NOT available ❌"
            exit 1
          fi

      - name: Pull and Run Originsign
        run: |
          set -euo pipefail
          export PATH="/tmp/podman:/tmp/podman/usr/local/bin:$PATH"

          echo "=== Pulling originsign image ==="
          podman pull forgestash.verify.oepkgs.net/dmgt/originsign:0.0.2

          echo "=== Running originsign container ==="
          # Start originsign server in background
          podman run -d --name originsign-server \
            -p 81:8081 \
            --privileged \
            -e AZURE_TENANT_ID="${AZURE_TENANT_ID:-}" \
            -e AZURE_CLIENT_ID="${AZURE_CLIENT_ID:-}" \
            -e AZURE_CLIENT_SECRET="${AZURE_CLIENT_SECRET:-}" \
            forgestash.verify.oepkgs.net/dmgt/originsign:0.0.2 \
            originsign server

          echo "=== Waiting for originsign server ==="
          for i in $(seq 1 10); do
            if curl -s http://localhost:81/v1/sign/digest -o /dev/null -w "%{http_code}" 2>/dev/null | grep -q 200; then
              echo "  server is up!"
              break
            fi
            echo "  waiting..."
            sleep 2
          done

          echo "=== Test: sign a digest ==="
          # Quick smoke test - sign a test digest
          curl -s -X POST http://localhost:81/v1/sign/digest \
            -H "Content-Type: application/json" \
            -d '{"base_config":{"algo":"rsa","kms":"local","flow":"sigstore","sys":"pki"},"digest":"Hello from GitCode CI","key_id":"test-key"}' 2>&1 || true

          echo "=== Cleanup ==="
          podman stop originsign-server || true
          podman rm originsign-server || true

          echo "RESULT: Podman pull+run works! ✅"
