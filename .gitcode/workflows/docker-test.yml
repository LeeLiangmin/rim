name: Originsign PE Signing Pipeline

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  sign-pe:
    runs-on: euleros-2.10.1
    steps:
      - uses: checkout-action@0.0.1
      - name: Setup originsign + osslsigncode
        run: |
          set -euo pipefail
          cd repo_workspace
          . .gitcode/.env
          export OBS_AK_XUANWU_RUST OBS_SK_XUANWU_RUST

          echo "=== Download originsign ==="
          bash .gitcode/scripts/download-originsign.sh /tmp/originsign
          export PATH="/tmp/originsign:$PATH"

          echo "=== Download osslsigncode ==="
          bash .gitcode/scripts/download-osslsigncode.sh /tmp/osslsigncode
          export PATH="/tmp/osslsigncode:$PATH"

          echo "=== Verify tools ==="
          originsign help 2>&1 | head -1 || true
          osslsigncode version 2>&1 || true

          echo "=== Init KMS + generate keys ==="
          originsign import --kms local
          originsign keygen --algo rsa
          originsign import --kms local --algo rsa --priv rsa-priv-key.pem --pub rsa-pub-key.pem
          originsign import --kms local --list

          echo "=== Start server ==="
          originsign server &
          sleep 3
          curl -s -o /dev/null http://localhost:8081 && echo "  server OK" || echo "  server FAIL"

      - name: Sign a test PE file
        run: |
          set -euo pipefail
          export PATH="/tmp/originsign:/tmp/osslsigncode:$PATH"

          echo "=== Create test PE file ==="
          printf '\x4d\x5a\x90\x00\x03\x00\x00\x00\x04\x00\x00\x00\xff\xff\x00\x00' > /tmp/test.exe
          truncate -s 16384 /tmp/test.exe 2>/dev/null || dd if=/dev/zero bs=1024 count=16 >> /tmp/test.exe 2>/dev/null || true
          echo "  test.exe: $(ls -la /tmp/test.exe)"

          echo "=== Sign test.exe ==="
          bash repo_workspace/.gitcode/scripts/sign-pe-originsign.sh /tmp/test.exe /tmp/test-signed.exe 2>&1 || true

          echo "=== Verify with osslsigncode ==="
          if [ -f /tmp/test-signed.exe ]; then
            osslsigncode verify /tmp/test-signed.exe 2>&1 || true
          fi

          echo "=== Cleanup ==="
          pkill originsign 2>/dev/null || true
          echo "=== Pipeline complete ==="
