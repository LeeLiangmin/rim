name: Originsign PE Signing Pipeline

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  sign-pe:
    runs-on: euleros-2.10.1
    steps:
      - uses: checkout-action@0.0.1
      - name: Setup originsign + osslsigncode
        run: |
          set -euo pipefail
          cd repo_workspace
          . .gitcode/.env
          export OBS_AK_XUANWU_RUST OBS_SK_XUANWU_RUST

          echo "=== Download originsign ==="
          bash .gitcode/scripts/download-originsign.sh /tmp/originsign
          export PATH="/tmp/originsign:$PATH"

          echo "=== Download osslsigncode ==="
          bash .gitcode/scripts/download-osslsigncode.sh /tmp/osslsigncode
          export PATH="/tmp/osslsigncode:$PATH"

          echo "=== Init KMS + generate keys ==="
          originsign import --kms local
          originsign keygen --algo rsa
          originsign import --kms local --algo rsa --priv rsa-priv-key.pem --pub rsa-pub-key.pem

          echo "=== Tools ready ==="

      - name: Sign hope.exe
        run: |
          set -euo pipefail
          cd repo_workspace && . .gitcode/.env
          export OBS_AK_XUANWU_RUST OBS_SK_XUANWU_RUST
          export PATH="/tmp/originsign:/tmp/osslsigncode:$PATH"

          echo "=== Download hope.exe from OBS ==="
          # Generate signed URL for hope.exe
          HOPE_URL=$(python3 -c "
import hashlib, hmac, datetime, urllib.parse, os
ak = os.environ['OBS_AK_XUANWU_RUST']; sk = os.environ['OBS_SK_XUANWU_RUST']
bucket='xuanwu-rust'; region='cn-north-4'; obj='dist/hope.exe'
t=datetime.datetime.utcnow(); ds=t.strftime('%Y%m%d'); amz_date=t.strftime('%Y%m%dT%H%M%SZ')
cred=ak+'/'+ds+'/'+region+'/s3/aws4_request'; qh='host'
qa='X-Amz-Algorithm=AWS4-HMAC-SHA256'; qc='X-Amz-Credential='+urllib.parse.quote(cred,safe='')
qd='X-Amz-Date='+amz_date; qe='X-Amz-Expires=3600'; qs='X-Amz-SignedHeaders='+qh
canon_qs=qa+'&'+qc+'&'+qd+'&'+qe+'&'+qs
canon='GET\n/'+obj+'\n'+canon_qs+'\nhost:'+bucket+'.obs.'+region+'.myhuaweicloud.com\n\n'+qh+'\nUNSIGNED-PAYLOAD'
scope=ds+'/'+region+'/s3/aws4_request'
sts='AWS4-HMAC-SHA256\n'+amz_date+'\n'+scope+'\n'+hashlib.sha256(canon.encode()).hexdigest()
def sign(k,m): return hmac.new(k,m.encode(),hashlib.sha256).digest()
skb=('AWS4'+sk).encode(); k=sign(sign(sign(sign(skb,ds),region),'s3'),'aws4_request')
sig=hmac.new(k,sts.encode(),hashlib.sha256).hexdigest()
print('https://'+bucket+'.obs.'+region+'.myhuaweicloud.com/'+obj+'?'+qa+'&'+qc+'&'+qd+'&'+qe+'&'+qs+'&X-Amz-Signature='+sig)
")
          curl -fsSL --connect-timeout 10 --max-time 60 -o /tmp/hope.exe "$HOPE_URL" 2>&1
          echo "  hope.exe: $(ls -la /tmp/hope.exe)"
          echo "  sha256: $(sha256sum /tmp/hope.exe | cut -d' ' -f1)"

          echo "=== Sign hope.exe ==="
          bash repo_workspace/.gitcode/scripts/sign-pe-originsign.sh /tmp/hope.exe /tmp/hope-signed.exe 2>&1

          echo "=== Verify signed file ==="
          if [ -f /tmp/hope-signed.exe ]; then
            ls -la /tmp/hope-signed.exe
            osslsigncode verify /tmp/hope-signed.exe 2>&1 || true
          fi

          echo "=== Cleanup ==="
          pkill originsign 2>/dev/null || true
          echo "=== Pipeline complete ==="
