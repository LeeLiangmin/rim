name: Podman Signing Service Test

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  podman-test:
    runs-on: euleros-2.10.1
    steps:
      - uses: checkout-action@0.0.1
      - name: Setup Podman
        run: |
          set -euo pipefail
          cd repo_workspace
          . .gitcode/.env
          export OBS_AK_XUANWU_RUST OBS_SK_XUANWU_RUST
          bash .gitcode/scripts/download-podman.sh /tmp/podman
          export PATH="/tmp/podman:/tmp/podman/usr/local/bin:$PATH"
          echo "=== Podman ready ==="
          podman --version
      - name: Pull and Run Originsign
        run: |
          set -euo pipefail
          export PATH="/tmp/podman:/tmp/podman/usr/local/bin:$PATH"
          # Tell podman user namespaces are pre-configured (skip re-exec)
          export _CONTAINERS_USERNS_CONFIGURED="done"
          echo "=== Pulling originsign image ==="
          podman --storage-driver=vfs --cgroup-manager=cgroupfs pull \
            forgestash.verify.oepkgs.net/dmgt/originsign:0.0.2
          echo "=== Running originsign server ==="
          podman --storage-driver=vfs --cgroup-manager=cgroupfs run -d --name originsign-server \
            -p 81:8081 \
            forgestash.verify.oepkgs.net/dmgt/originsign:0.0.2 \
            originsign server
          echo "=== Test signing API ==="
          sleep 5
          curl -s http://localhost:81/v1/sign/digest -X POST \
            -H "Content-Type: application/json" \
            -d '{"base_config":{"algo":"rsa","kms":"local","flow":"sigstore","sys":"pki"},"digest":"GitCode CI Test","key_id":"test"}' || true
          echo "=== Cleanup ==="
          podman stop originsign-server || true
          podman rm originsign-server || true
          echo "=== Podman pipeline complete! ==="
