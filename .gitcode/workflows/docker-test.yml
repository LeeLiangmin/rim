name: Originsign CI (extract from registry)

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  originsign-test:
    runs-on: euleros-2.10.1
    steps:
      - uses: checkout-action@0.0.1
      - name: Extract originsign
        run: |
          set -euo pipefail
          bash repo_workspace/.gitcode/scripts/download-originsign.sh /tmp/originsign
          export PATH="/tmp/originsign:$PATH"
          echo "=== originsign ready ==="
          originsign --version 2>&1 || true

      - name: Run originsign server + test API
        run: |
          set -euo pipefail
          export PATH="/tmp/originsign:$PATH"

          echo "=== Initializing KMS ==="
          originsign import --kms local
          originsign keygen --algo rsa
          originsign keygen --algo ecdsa
          originsign keygen --algo sm2 --sign-tool go-tongsuo

          echo "=== Importing keys ==="
          originsign import --kms local --algo rsa --priv rsa-priv-key.pem --pub rsa-pub-key.pem
          originsign import --kms local --algo ecdsa --priv ec-priv-key.pem --pub ec-pub-key.pem
          originsign import --kms local --algo sm2 --priv sm2-priv-key.pem --pub sm2-pub-key.pem
          originsign import --kms local --list

          echo "=== Starting server ==="
          originsign server &
          sleep 3

          echo "=== Testing sign API ==="
          curl -s -X POST http://localhost:8081/v1/sign/digest \
            -H "Content-Type: application/json" \
            -d '{"base_config":{"algo":"rsa","kms":"local","flow":"sigstore","sys":"pki"},"digest":"Hello GitCode CI","key_id":"test"}' || true

          echo "=== Cleanup ==="
          pkill originsign || true
          echo "=== Pipeline complete ==="
