name: Docker Image CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build:
    runs-on: euleros-2.10.1
    steps:
      - uses: checkout-action@0.0.1
      - name: Setup Docker
        run: |
          set -euo pipefail

          DOCKER_DIR="/tmp/docker"
          export PATH="$DOCKER_DIR:$PATH"

          if command -v docker >/dev/null 2>&1 && command -v dockerd >/dev/null 2>&1; then
            echo "Docker already available: $(docker --version)"
          else
            DOCKER_VERSION="24.0.7"
            DOCKER_MIRROR="https://mirrors.huaweicloud.com/docker-ce/linux/static/stable/x86_64/docker-${DOCKER_VERSION}.tgz"
            DOCKER_OFFICIAL="https://download.docker.com/linux/static/stable/x86_64/docker-${DOCKER_VERSION}.tgz"

            echo "=== Downloading Docker ${DOCKER_VERSION} ==="
            curl -fsSL --connect-timeout 10 --max-time 300 -o /tmp/docker.tgz "$DOCKER_MIRROR" 2>&1 || \
              curl -fsSL --connect-timeout 10 --max-time 300 -o /tmp/docker.tgz "$DOCKER_OFFICIAL" 2>&1

            echo "=== Extracting ==="
            rm -rf "$DOCKER_DIR"
            tar xzf /tmp/docker.tgz -C /tmp
            ls -la "$DOCKER_DIR/"
            echo "  docker:  $($DOCKER_DIR/docker --version)"
            echo "  dockerd: $($DOCKER_DIR/dockerd --version 2>&1 || true)"
            echo "  containerd: $(ls $DOCKER_DIR/containerd* 2>/dev/null || echo none)"
          fi

          echo "=== Starting dockerd ==="
          # Kill any existing dockerd
          pkill dockerd 2>/dev/null || true
          sleep 1

          # Data dir in tmp
          DOCKER_DATA="/tmp/docker-data"
          rm -rf "$DOCKER_DATA"
          mkdir -p "$DOCKER_DATA"

          # Check what user we are
          WHOAMI=$(whoami)
          echo "  running as: $WHOAMI (uid=$(id -u))"

          # Try sudo directly, then fallback to non-root
          DOCKERD_STARTED=false
          if command -v sudo >/dev/null 2>&1; then
            echo "  trying sudo dockerd..."
            sudo "$DOCKER_DIR/dockerd" \
              --data-root "$DOCKER_DATA" \
              --iptables=false \
              --ip6tables=false \
              --bridge=none \
              --host=unix:///tmp/docker.sock \
              --pidfile=/tmp/docker.pid \
              --log-level=warn \
              > /tmp/dockerd.log 2>&1 &
            DOCKERD_PID=$!
            sleep 1
            if kill -0 $DOCKERD_PID 2>/dev/null; then
              echo "  sudo dockerd started (pid=$DOCKERD_PID)"
              DOCKERD_STARTED=true
            else
              echo "  sudo failed, checking log..."
              cat /tmp/dockerd.log 2>/dev/null || true
            fi
          fi

          if [ "$DOCKERD_STARTED" = false ]; then
            echo "  trying rootless dockerd (will likely fail without rootlesskit)..."
            "$DOCKER_DIR/dockerd" \
              --data-root "$DOCKER_DATA" \
              --iptables=false \
              --ip6tables=false \
              --bridge=none \
              --host=unix:///tmp/docker.sock \
              --pidfile=/tmp/docker.pid \
              --log-level=warn \
              > /tmp/dockerd.log 2>&1 &
            DOCKERD_PID=$!
            sleep 1
            if kill -0 $DOCKERD_PID 2>/dev/null; then
              echo "  rootless dockerd started (pid=$DOCKERD_PID)"
              DOCKERD_STARTED=true
            fi
          fi

          # Wait for dockerd to be ready
          echo "  waiting for dockerd to start..."
          export DOCKER_HOST=unix:///tmp/docker.sock
          for i in $(seq 1 15); do
            if docker info >/dev/null 2>&1; then
              echo "  dockerd is ready! (took ${i}s)"
              break
            fi
            sleep 1
            echo "  ."
          done

          # Show status
          echo "=== Dockerd status ==="
          if docker info >/dev/null 2>&1; then
            docker info 2>&1 | head -15
          else
            echo "  ERROR: dockerd failed to start"
            echo "  --- dockerd log ---"
            cat /tmp/dockerd.log 2>/dev/null || true
            echo "  --- end log ---"
            exit 1
          fi

          # Save env for next step
          echo "DOCKER_HOST=unix:///tmp/docker.sock" > /tmp/docker-env
          echo "PATH=$DOCKER_DIR:$PATH" >> /tmp/docker-env

      - name: Build and Run Docker image
        run: |
          set -euo pipefail

          # Source env from previous step
          if [ -f /tmp/docker-env ]; then
            source /tmp/docker-env
          fi
          export DOCKER_HOST="${DOCKER_HOST:-unix:///tmp/docker.sock}"
          export PATH="/tmp/docker:$PATH"

          echo "=== Docker info ==="
          docker version 2>&1 || true
          echo "=== Building test image ==="
          mkdir -p /tmp/docker-build
          cat > /tmp/docker-build/Dockerfile <<'DOCKEREOF'
          FROM alpine:3.20
          RUN echo "Docker CI is working!"
          CMD ["echo", "Hello from Docker Image CI"]
          DOCKEREOF
          docker build -f /tmp/docker-build/Dockerfile -t docker-ci-test:latest /tmp/docker-build

          echo "=== Running test container ==="
          docker run --rm docker-ci-test:latest

          echo "=== Docker cleanup ==="
          docker rmi docker-ci-test:latest || true
          echo "=== Docker pipeline complete! ==="
