name: Originsign PE Signing Pipeline

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  sign-pe:
    runs-on: euleros-2.10.1
    steps:
      - uses: checkout-action@0.0.1
      - name: Setup originsign + osslsigncode
        run: |
          set -euo pipefail
          cd repo_workspace
          . .gitcode/.env
          export OBS_AK_XUANWU_RUST OBS_SK_XUANWU_RUST

          echo "=== Download originsign ==="
          bash .gitcode/scripts/download-originsign.sh /tmp/originsign
          export PATH="/tmp/originsign:$PATH"

          echo "=== Download osslsigncode ==="
          bash .gitcode/scripts/download-osslsigncode.sh /tmp/osslsigncode
          export PATH="/tmp/osslsigncode:$PATH"

          echo "=== Init KMS + generate keys ==="
          originsign import --kms local
          originsign keygen --algo rsa
          originsign import --kms local --algo rsa --priv rsa-priv-key.pem --pub rsa-pub-key.pem

          echo "=== Start originsign server ==="
          nohup originsign server > /tmp/originsign.log 2>&1 &
          sleep 3
          curl -s -o /dev/null http://localhost:8081 && echo "  server OK" || echo "  server FAIL"

          echo "=== Tools ready ==="

      - name: Sign hope.exe
        run: |
          set -euo pipefail
          cd repo_workspace && . .gitcode/.env
          export OBS_AK_XUANWU_RUST OBS_SK_XUANWU_RUST
          export PATH="/tmp/originsign:/tmp/osslsigncode:$PATH"

          # Ensure server is running (step can re-use from setup)
          if ! curl -s http://localhost:8081 > /dev/null 2>&1; then
            echo "  restarting server..."
            nohup originsign server > /tmp/originsign.log 2>&1 &
            sleep 3
          fi

          echo "=== Download hope.exe from OBS ==="
          echo "" | base64 -d > /tmp/obs-sign-hope.py
          HOPE_URL=$(python3 /tmp/obs-sign-hope.py)
          curl -fsSL --connect-timeout 10 --max-time 60 -o /tmp/hope.exe "$HOPE_URL" 2>&1
          echo "  hope.exe: $(ls -la /tmp/hope.exe)"

          echo "=== Sign hope.exe ==="
          bash .gitcode/scripts/sign-pe-originsign.sh /tmp/hope.exe /tmp/hope-signed.exe

          echo "=== Verify ==="
          ls -la /tmp/hope-signed.exe
          osslsigncode verify /tmp/hope-signed.exe 2>&1 | grep -E "Succeeded|digest|Message" || true

      - name: Cleanup server
        run: pkill originsign 2>/dev/null; echo "server stopped"

      - name: Upload signed file to release
        run: |
          set -euo pipefail
          cd repo_workspace
          . .gitcode/.env
          python3 -c "import httpx" 2>/dev/null || pip3 install --quiet httpx || true
          mkdir -p dist/signed
          cp /tmp/hope-signed.exe dist/signed/hope-signed.exe
          bash .gitcode/scripts/upload-gitcode-release.sh --tag "${DEFAULT_RELEASE_TAG:-dev}" --dist-dir dist/signed
