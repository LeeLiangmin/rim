name: Originsign CI (extract from registry)

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  originsign-test:
    runs-on: euleros-2.10.1
    steps:
      - uses: checkout-action@0.0.1
      - name: Extract originsign
        run: |
          set -euo pipefail
          bash repo_workspace/.gitcode/scripts/download-originsign.sh /tmp/originsign
          export PATH="/tmp/originsign:$PATH"
          echo "=== originsign ready ==="
          originsign --version 2>&1 || true

      - name: Run originsign server + test API
        run: |
          set -euo pipefail
          export PATH="/tmp/originsign:$PATH"

          echo "=== Initializing KMS ==="
          originsign import --kms local
          originsign keygen --algo rsa
          originsign keygen --algo ecdsa
          originsign keygen --algo sm2 --sign-tool go-tongsuo

          echo "=== Importing keys ==="
          originsign import --kms local --algo rsa --priv rsa-priv-key.pem --pub rsa-pub-key.pem
          originsign import --kms local --algo ecdsa --priv ec-priv-key.pem --pub ec-pub-key.pem
          originsign import --kms local --algo sm2 --priv sm2-priv-key.pem --pub sm2-pub-key.pem
          KEY_ID=$(originsign import --kms local --list 2>&1 | grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' | head -1)
          echo "Using key_id: $KEY_ID"

          echo "=== Starting server ==="
          originsign server &
          SERVER_PID=$!
          sleep 3

          echo "=== Sign test digest ==="
          SIGN_RESP=$(curl -s -X POST http://localhost:8081/v1/sign/digest \
            -H "Content-Type: application/json" \
            -d "{\"base_config\":{\"algo\":\"rsa\",\"kms\":\"local\",\"flow\":\"sigstore\",\"sys\":\"pki\"},\"digest\":\"Hello GitCode CI\",\"key_id\":\"$KEY_ID\"}")
          echo "$SIGN_RESP"

          echo "=== Verify signature ==="
          SIGNATURE=$(echo "$SIGN_RESP" | python3 -c "import sys,json; print(json.load(sys.stdin).get('signature',''))" 2>/dev/null || echo "")
          if [ -n "$SIGNATURE" ]; then
            curl -s -X POST http://localhost:8081/v1/verify/digest \
              -H "Content-Type: application/json" \
              -d "{\"base_config\":{\"algo\":\"rsa\",\"flow\":\"sigstore\",\"kms\":\"local\",\"sys\":\"pki\"},\"key_id\":\"$KEY_ID\",\"digest\":\"Hello GitCode CI\",\"signature\":\"$SIGNATURE\"}"
          fi

          echo "=== Cleanup ==="
          kill $SERVER_PID 2>/dev/null || true
          echo "=== Originsign pipeline complete! ==="
