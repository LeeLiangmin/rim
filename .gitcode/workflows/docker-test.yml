name: Docker Image CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  build:
    runs-on: euleros-2.10.1
    steps:
      - uses: checkout-action@0.0.1
      - name: Install Docker
        run: |
          set -euo pipefail

          echo "=== Check if Docker is already installed ==="
          if command -v docker >/dev/null 2>&1; then
            echo "Docker already installed: $(docker --version)"
            exit 0
          fi

          echo "=== OS detection ==="
          cat /etc/os-release 2>/dev/null || true
          echo "  kernel: $(uname -r)"
          echo "  arch: $(uname -m)"

          echo "=== Current yum repos ==="
          ls -la /etc/yum.repos.d/ 2>/dev/null || echo "  (empty or missing)"

          echo "=== Fix yum shebang: find python3.7 ==="
          PY37_BIN=""
          for p in /usr/bin/python3.7 /usr/bin/python37; do
            if [ -x "$p" ]; then
              echo "  found: $p ($($p --version 2>&1))"
              PY37_BIN="$p"
              break
            fi
          done
          if [ -z "$PY37_BIN" ]; then
            echo "  ERROR: no python3.7 found"
            exit 1
          fi

          echo "=== Configure yum repos ==="
          # EulerOS 2.10 is based on CentOS 7/RHEL 7.
          # Try Huawei Cloud mirrors first, then fallback to others.
          cat > /etc/yum.repos.d/euleros.repo <<'REPOEOF'
          [base]
          name=EulerOS-2.10-base
          baseurl=https://mirrors.huaweicloud.com/euler/2.10/os/x86_64/
          enabled=1
          gpgcheck=0

          [updates]
          name=EulerOS-2.10-updates
          baseurl=https://mirrors.huaweicloud.com/euler/2.10/updates/x86_64/
          enabled=1
          gpgcheck=0

          [extras]
          name=EulerOS-2.10-extras
          baseurl=https://mirrors.huaweicloud.com/euler/2.10/extras/x86_64/
          enabled=1
          gpgcheck=0
          REPOEOF

          echo "=== Test yum with new repos ==="
          if $PY37_BIN /bin/yum repolist 2>&1; then
            echo "  yum repos are working!"
          else
            echo "  Huawei EulerOS mirrors failed, trying CentOS mirrors..."
            cat > /etc/yum.repos.d/centos.repo <<'REPOEOF'
            [base]
            name=CentOS-7-base
            baseurl=https://mirrors.huaweicloud.com/centos/7/os/x86_64/
            enabled=1
            gpgcheck=0

            [updates]
            name=CentOS-7-updates
            baseurl=https://mirrors.huaweicloud.com/centos/7/updates/x86_64/
            enabled=1
            gpgcheck=0

            [extras]
            name=CentOS-7-extras
            baseurl=https://mirrors.huaweicloud.com/centos/7/extras/x86_64/
            enabled=1
            gpgcheck=0

            [epel]
            name=EPEL-7
            baseurl=https://mirrors.huaweicloud.com/epel/7/x86_64/
            enabled=1
            gpgcheck=0
            REPOEOF

            if $PY37_BIN /bin/yum repolist 2>&1; then
              echo "  CentOS mirrors are working!"
            else
              echo "  ERROR: all repo mirrors failed, cannot install Docker"
              exit 1
            fi
          fi

          echo "=== Install Docker ==="
          $PY37_BIN /bin/yum install -y docker docker-engine 2>&1 || {
            echo "  yum install docker failed, trying docker-ce..."
            # Try docker-ce repo
            cat > /etc/yum.repos.d/docker-ce.repo <<'REPOEOF'
            [docker-ce-stable]
            name=Docker CE Stable
            baseurl=https://mirrors.huaweicloud.com/docker-ce/linux/centos/7/x86_64/stable/
            enabled=1
            gpgcheck=0
            REPOEOF
            $PY37_BIN /bin/yum install -y docker-ce docker-ce-cli containerd.io 2>&1
          }

          if command -v docker >/dev/null 2>&1; then
            echo "=== Docker installed successfully: $(docker --version) ==="
          else
            echo "=== ERROR: Docker still not available ==="
            exit 1
          fi
      - name: Build the Docker image
        run: |
          set -euo pipefail
          echo "=== Docker version ==="
          docker version 2>&1 || true
          echo "=== Building test image ==="
          mkdir -p /tmp/docker-test
          cat > /tmp/docker-test/Dockerfile <<'EOF'
          FROM alpine:3.20
          RUN echo "Docker CI is working!"
          CMD ["echo", "Hello from Docker Image CI"]
          EOF
          docker build -f /tmp/docker-test/Dockerfile -t my-image-name:$(date +%s) /tmp/docker-test
          echo "=== Docker image built successfully ==="
