name: Docker Capability Test

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  # ============================================================
  # Test 1: Try different runner labels for native Docker support
  # ============================================================
  test-ubuntu:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Check Docker (ubuntu-latest)
        run: |
          set -euo pipefail
          echo "=== OS ===" && cat /etc/os-release | head -3 || true
          echo "=== Docker ==="
          if command -v docker >/dev/null 2>&1; then
            docker version 2>&1 || true
            docker info 2>&1 | head -5 || true
            echo "=== Building test image ==="
            docker build --label test=true -t docker-test:latest - <<'EOF'
          FROM alpine:3.20
          RUN echo "Docker on ubuntu-latest works!"
          CMD ["echo", "Hello from ubuntu-latest"]
          EOF
            docker run --rm docker-test:latest
            echo "RESULT: ubuntu-latest has working Docker! ✅"
          else
            echo "RESULT: ubuntu-latest has NO Docker ❌"
          fi

  test-centos:
    runs-on: centos-latest
    continue-on-error: true
    steps:
      - name: Check Docker (centos-latest)
        run: |
          set -euo pipefail
          echo "=== OS ===" && cat /etc/os-release | head -3 || true
          if command -v docker >/dev/null 2>&1; then
            docker version 2>&1 || true
            echo "RESULT: centos-latest has working Docker! ✅"
          else
            echo "RESULT: centos-latest has NO Docker ❌"
          fi

  test-euleros-native:
    runs-on: euleros-latest
    continue-on-error: true
    steps:
      - name: Check Docker (euleros-latest)
        run: |
          set -euo pipefail
          echo "=== OS ===" && cat /etc/os-release | head -3 || true
          if command -v docker >/dev/null 2>&1; then
            docker version 2>&1 || true
            echo "RESULT: euleros-latest has working Docker! ✅"
          else
            echo "RESULT: euleros-latest has NO Docker ❌"
          fi

  # ============================================================
  # Test 2: Podman (rootless, no daemon needed)
  # ============================================================
  test-podman:
    runs-on: euleros-2.10.1
    continue-on-error: true
    steps:
      - name: Setup Podman
        run: |
          set -euo pipefail

          PODMAN_DIR="/tmp/podman"
          export PATH="$PODMAN_DIR:$PATH"

          if command -v podman >/dev/null 2>&1; then
            echo "Podman already installed: $(podman --version)"
            exit 0
          fi

          echo "=== OS ===" && cat /etc/os-release | head -3 || true

          # Try yum first
          echo "=== Attempt yum install podman ==="
          PY37_BIN=""
          for p in /usr/bin/python3.7 /usr/bin/python37; do
            [ -x "$p" ] && PY37_BIN="$p" && break
          done
          if [ -n "$PY37_BIN" ]; then
            $PY37_BIN /bin/yum install -y podman 2>&1 && echo "Podman installed via yum" || true
          fi

          # Fallback: static binary
          if ! command -v podman >/dev/null 2>&1; then
            echo "=== Downloading Podman static binary ==="
            PODMAN_URL="https://github.com/mgoltzsche/podman-static/releases/download/v4.7.1/podman-linux-amd64.tar.gz"
            if curl -fsSL --connect-timeout 10 --max-time 300 -o /tmp/podman.tar.gz "$PODMAN_URL" 2>&1; then
              mkdir -p "$PODMAN_DIR"
              tar xzf /tmp/podman.tar.gz -C "$PODMAN_DIR"
              echo "Podman extracted: $(which podman 2>/dev/null || echo not found)"
            else
              echo "Podman download failed"
            fi
          fi

          if command -v podman >/dev/null 2>&1; then
            echo "=== Podman version ==="
            podman --version
            echo "RESULT: Podman binary available ✅"
          else
            echo "RESULT: Podman NOT available ❌"
          fi

      - name: Build and Run with Podman
        run: |
          set -euo pipefail
          export PATH="/tmp/podman:$PATH"

          if ! command -v podman >/dev/null 2>&1; then
            echo "Podman not available, skipping build test"
            exit 0
          fi

          echo "=== Podman version ==="
          podman version 2>&1 || true
          podman info 2>&1 | head -10 || true

          echo "=== Building test image ==="
          cat > /tmp/Containerfile <<'EOF'
          FROM alpine:3.20
          RUN echo "Podman CI is working!"
          CMD ["echo", "Hello from Podman CI"]
          EOF
          podman build -f /tmp/Containerfile -t podman-test:latest /tmp

          echo "=== Running test container ==="
          podman run --rm podman-test:latest

          echo "=== Cleanup ==="
          podman rmi podman-test:latest || true
          echo "RESULT: Podman build+run works! ✅"
