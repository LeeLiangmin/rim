name: Test GitCode Release Upload

on:
  push:
    branches: [ "llm" ]

jobs:
  upload-text-file:
    name: Upload generated text file to release
    runs-on: euleros-2.10.1

    steps:
      - name: Checkout source code
        uses: checkout-action@0.0.1

      - name: Create test files
        run: |
          set -euo pipefail
          cd repo_workspace
          mkdir -p release-assets

          cat > release-assets/test-upload-1.txt <<EOF
          GitCode release upload test
          workflow: upload.yml
          created at: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF

          cat > release-assets/test-upload-2.txt <<EOF
          Second test file
          created at: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF

          echo "=== files to upload ==="
          find release-assets -type f -print

      - name: Create release and upload files
        run: |
          set -euo pipefail
          cd repo_workspace

          # TODO: 正式使用时应通过 CI 环境变量注入，不要硬编码
          ACCESS_TOKEN="5yyPyAvBcv2UVTog37nEe378"

          # 固定 tag 用于试验
          RELEASE_TAG="dev"
          OWNER="xuanwu"
          REPO="custom-rust-dist"
          API_BASE="https://api.gitcode.com/api/v5/repos/${OWNER}/${REPO}"
          UPLOAD_DIR="release-assets"

          echo "owner: $OWNER"
          echo "repo: $REPO"
          echo "tag: $RELEASE_TAG"

          echo ""
          echo "=== Step 1: Create release (tag=${RELEASE_TAG}) ==="
          curl -sS -X POST \
            "${API_BASE}/releases?access_token=${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"tag_name\":\"${RELEASE_TAG}\",\"name\":\"${RELEASE_TAG}\",\"body\":\"Upload test from upload.yml\"}" \
            || echo "release may already exist, continuing..."

          echo ""
          echo "=== Step 2: Upload files from ${UPLOAD_DIR} ==="
          find "$UPLOAD_DIR" -maxdepth 1 -type f | while read -r file; do
            filename=$(basename "$file")
            echo ""
            echo ">>> [${filename}] getting upload url..."

            UPLOAD_RESP=$(curl -sS \
              "${API_BASE}/releases/${RELEASE_TAG}/upload_url?access_token=${ACCESS_TOKEN}&file_name=${filename}")

            echo ">>> [${filename}] upload_url response: $UPLOAD_RESP"

            # 用 sed 提取 url 字段
            UPLOAD_URL=$(echo "$UPLOAD_RESP" | sed -n 's/.*"url" *: *"\([^"]*\)".*/\1/p')

            if [ -z "$UPLOAD_URL" ]; then
              echo "ERROR: failed to get upload url for $filename"
              echo "Response: $UPLOAD_RESP"
              continue
            fi

            # 从 headers 对象提取请求头，写入 curl 配置文件
            # API 返回格式: {"url":"...","headers":{"K1":"V1","K2":"V2"}}
            CURL_CFG="/tmp/curl_headers.cfg"
            : > "$CURL_CFG"
            HEADERS_BLOCK=$(echo "$UPLOAD_RESP" | sed 's/.*"headers" *: *{//;s/}.*//')
            if [ -n "$HEADERS_BLOCK" ]; then
              echo "$HEADERS_BLOCK" | tr ',' '\n' | \
                sed -n 's/^ *"\([^"]*\)" *: *"\([^"]*\)" *$/header = "\1: \2"/p' >> "$CURL_CFG"
            fi

            echo ">>> [${filename}] curl config:"
            cat "$CURL_CFG"

            echo ">>> [${filename}] uploading to pre-signed url..."
            HTTP_CODE=$(curl -sS -o /tmp/upload_body.txt -w "%{http_code}" \
              -K "$CURL_CFG" \
              -X PUT "$UPLOAD_URL" \
              --upload-file "$file")

            echo ">>> [${filename}] upload response body: $(cat /tmp/upload_body.txt 2>/dev/null)"

            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
              echo ">>> [${filename}] uploaded OK (HTTP ${HTTP_CODE})"
            else
              echo ">>> [${filename}] upload FAILED (HTTP ${HTTP_CODE})"
            fi
          done

          echo ""
          echo "=== Done ==="
