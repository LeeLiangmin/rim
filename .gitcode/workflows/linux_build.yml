name: Linux CLI Build

on:
  push:
    branches: [ "llm" ]
  pull_request:
    branches: [ "llm" ]

jobs:
  build-cli:
    runs-on: euleros-2.10.1

    env:
      EDITION: community
      RUSTUP_DIST_SERVER: https://mirror.xuanwu.openatom.cn
      RUSTUP_UPDATE_ROOT: https://mirror.xuanwu.openatom.cn/rustup

    steps:
      - uses: checkout-action@0.0.1

      - name: Setup Node.js
        uses: setup-node@0.0.1
        with:
          node-version: '20.10.0'

      - name: Check system
        run: |
          set -e
          cd repo_workspace
          uname -a
          cat /etc/os-release
          pwd
          test -f Cargo.toml

      - name: Verify preinstalled dependencies
        run: |
          set -e
          cd repo_workspace
          echo "=== C compiler ==="
          gcc --version
          echo "=== make ==="
          make --version
          echo "=== perl ==="
          perl --version
          echo "=== pkg-config ==="
          pkg-config --version
          echo "=== openssl ==="
          pkg-config --exists openssl && echo "openssl OK" || echo "WARN: openssl not found via pkg-config"
          echo "=== node ==="
          node --version
          npm --version

      - name: Install Rust
        run: |
          set -e
          cd repo_workspace
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          fi
          . "$HOME/.cargo/env"
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-unknown-linux-musl || echo "WARN: musl target add failed"
          rustc --version
          cargo --version

      - name: Configure cargo mirror
        run: |
          set -e
          cd repo_workspace
          mkdir -p .cargo
          cat > .cargo/config.toml <<'EOF'
          [source.crates-io]
          replace-with = 'xuanwu-sparse'

          [source.xuanwu]
          registry = "https://mirror.xuanwu.openatom.cn/crates.io-index"

          [source.xuanwu-sparse]
          registry = "sparse+https://mirror.xuanwu.openatom.cn/index/"

          [registries.xuanwu]
          index = "https://mirror.xuanwu.openatom.cn/crates.io-index"

          [net]
          git-fetch-with-cli = true
          EOF

      - name: Build CLI
        run: |
          set -e
          cd repo_workspace
          . "$HOME/.cargo/env"

          # 从 workspace 排除 rim_gui，避免解析其 GitHub git 依赖（CI 环境访问 github.com 极慢）
          sed -i 's|"rim_gui/src-tauri", ||' Cargo.toml
          echo "workspace members after patch:"
          grep -A5 '\[workspace\]' Cargo.toml | head -6

          # 设置 git 超时兜底，防止网络问题导致长时间挂起
          export GIT_HTTP_LOW_SPEED_LIMIT=1000
          export GIT_HTTP_LOW_SPEED_TIME=30

          if command -v musl-gcc >/dev/null 2>&1; then
            echo "=== Building with musl target ==="
            cargo run -p rim_dev -- dist --cli -b --target x86_64-unknown-linux-musl --for x86_64-unknown-linux-gnu
          else
            echo "=== Building with gnu target ==="
            cargo run -p rim_dev -- dist --cli -b --for x86_64-unknown-linux-gnu
          fi

      - name: Validate and list build artifacts
        run: |
          set -e
          cd repo_workspace
          ls -al dist || true
          ls -al dist/x86_64-unknown-linux-gnu || true
          test -d dist/x86_64-unknown-linux-gnu
          find dist/x86_64-unknown-linux-gnu -maxdepth 2 -type f -print

      - name: Upload to GitCode Release
        run: |
          set -euo pipefail
          cd repo_workspace

          # TODO: 正式使用时应通过 CI 环境变量注入，不要硬编码
          ACCESS_TOKEN="5yyPyAvBcv2UVTog37nEe378"

          RELEASE_TAG="dev"
          OWNER="xuanwu"
          REPO="custom-rust-dist"
          API_BASE="https://api.gitcode.com/api/v5/repos/${OWNER}/${REPO}"
          UPLOAD_DIR="dist/x86_64-unknown-linux-gnu"

          echo "=== Step 1: Create release (tag=${RELEASE_TAG}) ==="
          curl -sS -X POST \
            "${API_BASE}/releases?access_token=${ACCESS_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"tag_name\":\"${RELEASE_TAG}\",\"name\":\"${RELEASE_TAG}\",\"body\":\"Auto release from linux-build CI\"}" \
            || echo "release may already exist, continuing..."

          echo ""
          echo "=== Step 2: Upload artifacts from ${UPLOAD_DIR} ==="
          find "$UPLOAD_DIR" -maxdepth 1 -type f | while read -r file; do
            filename=$(basename "$file")
            echo ""
            echo ">>> [${filename}] getting upload url..."

            UPLOAD_RESP=$(curl -sS \
              "${API_BASE}/releases/${RELEASE_TAG}/upload_url?access_token=${ACCESS_TOKEN}&file_name=${filename}")

            echo ">>> [${filename}] upload_url response: $UPLOAD_RESP"

            # 用 sed 提取 url 字段
            UPLOAD_URL=$(echo "$UPLOAD_RESP" | sed -n 's/.*"url" *: *"\([^"]*\)".*/\1/p')

            if [ -z "$UPLOAD_URL" ]; then
              echo "ERROR: failed to get upload url for $filename"
              continue
            fi

            # 从 headers 对象提取请求头，写入 curl 配置文件
            CURL_CFG="/tmp/curl_headers.cfg"
            : > "$CURL_CFG"
            HEADERS_BLOCK=$(echo "$UPLOAD_RESP" | sed 's/.*"headers" *: *{//;s/}.*//')
            if [ -n "$HEADERS_BLOCK" ]; then
              echo "$HEADERS_BLOCK" | tr ',' '\n' | \
                sed -n 's/^ *"\([^"]*\)" *: *"\([^"]*\)" *$/header = "\1: \2"/p' >> "$CURL_CFG"
            fi

            echo ">>> [${filename}] uploading to pre-signed url..."
            HTTP_CODE=$(curl -sS -o /tmp/upload_body.txt -w "%{http_code}" \
              -K "$CURL_CFG" \
              -X PUT "$UPLOAD_URL" \
              --upload-file "$file")

            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
              echo ">>> [${filename}] uploaded OK (HTTP ${HTTP_CODE})"
            else
              echo ">>> [${filename}] upload FAILED (HTTP ${HTTP_CODE})"
              echo ">>> response: $(cat /tmp/upload_body.txt 2>/dev/null)"
            fi
          done

          echo ""
          echo "=== Done ==="