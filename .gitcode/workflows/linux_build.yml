name: Linux System Check

on:
  push:
    branches: [ "llm" ]
  pull_request:
    branches: [ "llm" ]

jobs:
  system-check:
    runs-on: ubuntu:latest

    steps:
      - uses: checkout-action@0.0.1

      - name: Setup Node.js
        uses: setup-node@0.0.1
        with:
          node-version: '20.10.0'

      - name: Check system
        run: |
          uname -a
          cat /etc/os-release

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Check Rust
        run: |
          rustc --version
          cargo --version

      - name: Check Node.js
        run: |
          node --version
          npm --version