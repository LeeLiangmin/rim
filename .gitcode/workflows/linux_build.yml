name: Linux CLI Build

on:
  push:
    branches: [ "llm" ]
  pull_request:
    branches: [ "llm" ]

jobs:
  build-cli:
    runs-on: euleros-2.10.1

    env:
      EDITION: community

    steps:
      - uses: checkout-action@0.0.1

      - name: Setup Node.js
        uses: setup-node@0.0.1
        with:
          node-version: '20.10.0'

      - name: Check system
        run: |
          uname -a
          cat /etc/os-release

      - name: Install system dependencies
        run: |
          yum install -y gcc gcc-c++ make perl pkgconfig openssl-devel xz-devel curl wget || true

      - name: Verify dependencies
        run: |
          echo "=== C compiler ==="
          gcc --version || echo "FAIL: no gcc"
          echo "=== make ==="
          make --version || echo "FAIL: no make"
          echo "=== perl ==="
          perl --version || echo "FAIL: no perl"
          echo "=== pkg-config ==="
          pkg-config --version || echo "FAIL: no pkg-config"
          echo "=== openssl ==="
          pkg-config --exists openssl && echo "openssl OK" || echo "WARN: openssl not found via pkg-config"
          echo "=== node ==="
          node --version
          npm --version

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          . "$HOME/.cargo/env"
          rustup target add x86_64-unknown-linux-musl || echo "WARN: musl target add failed"
          rustc --version
          cargo --version

      - name: Build CLI
        run: |
          . "$HOME/.cargo/env"
          if which musl-gcc &> /dev/null; then
            echo "=== Building with musl target ==="
            cargo dev dist --cli -b --target x86_64-unknown-linux-musl --for x86_64-unknown-linux-gnu
          else
            echo "=== Building with gnu target ==="
            cargo dev dist --cli -b --for x86_64-unknown-linux-gnu
          fi

      - name: List build artifacts
        run: |
          ls -alR dist/ || echo "No dist directory found"
