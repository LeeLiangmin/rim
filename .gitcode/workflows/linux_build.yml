name: Linux CLI Build

on:
  push:
    branches: [ "llm" ]
  pull_request:
    branches: [ "llm" ]

jobs:
  build-cli:
    runs-on: euleros-2.10.1

    env:
      EDITION: community
      REPO_DIR: repo_workspace
      DIST_TARGET: x86_64-unknown-linux-gnu
      MUSL_TARGET: x86_64-unknown-linux-musl
      RUSTUP_DIST_SERVER: https://mirror.xuanwu.openatom.cn
      RUSTUP_UPDATE_ROOT: https://mirror.xuanwu.openatom.cn/rustup

    steps:
      - uses: checkout-action@0.0.1

      - name: Setup Node.js
        uses: setup-node@0.0.1
        with:
          node-version: '20.10.0'

      - name: Check system
        run: |
          set -e
          uname -a
          cat /etc/os-release
          pwd
          ls -al
          test -f "$REPO_DIR/Cargo.toml"

      - name: Verify preinstalled dependencies
        run: |
          set -e
          echo "=== C compiler ==="
          gcc --version
          echo "=== make ==="
          make --version
          echo "=== perl ==="
          perl --version
          echo "=== pkg-config ==="
          pkg-config --version
          echo "=== openssl ==="
          pkg-config --exists openssl && echo "openssl OK" || echo "WARN: openssl not found via pkg-config"
          echo "=== node ==="
          node --version
          npm --version

      - name: Install Rust
        run: |
          set -e
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          fi
          . "$HOME/.cargo/env"
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add "$MUSL_TARGET" || echo "WARN: musl target add failed"
          rustc --version
          cargo --version

      - name: Configure cargo mirror
        run: |
          set -e
          mkdir -p "$REPO_DIR/.cargo"
          cat > "$REPO_DIR/.cargo/config.toml" <<'EOF'
          [source.crates-io]
          replace-with = 'xuanwu-sparse'

          [source.xuanwu]
          registry = "https://mirror.xuanwu.openatom.cn/crates.io-index"

          [source.xuanwu-sparse]
          registry = "sparse+https://mirror.xuanwu.openatom.cn/index/"

          [registries.xuanwu]
          index = "https://mirror.xuanwu.openatom.cn/crates.io-index"

          [net]
          git-fetch-with-cli = true
          EOF

      - name: Build CLI
        run: |
          set -e
          . "$HOME/.cargo/env"
          cd "$REPO_DIR"
          cargo run -p rim_dev -- --help >/dev/null
          if command -v musl-gcc >/dev/null 2>&1; then
            echo "=== Building with musl target ==="
            cargo run -p rim_dev -- dist --cli -b --target "$MUSL_TARGET" --for "$DIST_TARGET"
          else
            echo "=== Building with gnu target ==="
            cargo run -p rim_dev -- dist --cli -b --for "$DIST_TARGET"
          fi

      - name: Validate and list build artifacts
        run: |
          set -e
          cd "$REPO_DIR"
          test -d "dist/$DIST_TARGET"
          find "dist/$DIST_TARGET" -maxdepth 2 -type f -print