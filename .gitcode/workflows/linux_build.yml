name: Linux CLI Build

on:
  push:
    branches: [ "llm" ]
  pull_request:
    branches: [ "llm" ]

jobs:
  build-cli:
    runs-on: euleros-2.10.1

    env:
      EDITION: community
      RUSTUP_DIST_SERVER: https://mirror.xuanwu.openatom.cn
      RUSTUP_UPDATE_ROOT: https://mirror.xuanwu.openatom.cn/rustup

    steps:
      - uses: checkout-action@0.0.1

      - name: Setup Node.js
        uses: setup-node@0.0.1
        with:
          node-version: '20.10.0'

      - name: Check system
        run: |
          set -e
          cd repo_workspace
          uname -a
          cat /etc/os-release
          pwd
          test -f Cargo.toml

      - name: Verify preinstalled dependencies
        run: |
          set -e
          cd repo_workspace
          echo "=== C compiler ==="
          gcc --version
          echo "=== make ==="
          make --version
          echo "=== perl ==="
          perl --version
          echo "=== pkg-config ==="
          pkg-config --version
          echo "=== openssl ==="
          pkg-config --exists openssl && echo "openssl OK" || echo "WARN: openssl not found via pkg-config"
          echo "=== node ==="
          node --version
          npm --version

      - name: Install Rust
        run: |
          set -e
          cd repo_workspace
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          fi
          . "$HOME/.cargo/env"
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-unknown-linux-musl || echo "WARN: musl target add failed"
          rustup target add aarch64-unknown-linux-gnu || echo "WARN: aarch64 gnu target add failed"
          rustc --version
          cargo --version

      - name: Configure cargo mirror
        run: |
          set -e
          cd repo_workspace
          mkdir -p .cargo
          cat > .cargo/config.toml <<'CARGO_EOF'
          [source.crates-io]
          replace-with = 'xuanwu-sparse'

          [source.xuanwu]
          registry = "https://mirror.xuanwu.openatom.cn/crates.io-index"

          [source.xuanwu-sparse]
          registry = "sparse+https://mirror.xuanwu.openatom.cn/index/"

          [registries.xuanwu]
          index = "https://mirror.xuanwu.openatom.cn/crates.io-index"

          [net]
          git-fetch-with-cli = true
          CARGO_EOF

      - name: Build CLI
        run: |
          set -e
          cd repo_workspace
          . "$HOME/.cargo/env"

          # 从 workspace 排除 rim_gui，避免解析其 GitHub git 依赖（CI 环境访问 github.com 极慢）
          sed -i 's|"rim_gui/src-tauri", ||' Cargo.toml
          echo "workspace members after patch:"
          grep -A5 '\[workspace\]' Cargo.toml | head -6

          # 设置 git 超时兜底，防止网络问题导致长时间挂起
          export GIT_HTTP_LOW_SPEED_LIMIT=1000
          export GIT_HTTP_LOW_SPEED_TIME=30

          if command -v musl-gcc >/dev/null 2>&1; then
            echo "=== Building x86_64 with musl target ==="
            cargo run -p rim_dev -- dist --cli -b --target x86_64-unknown-linux-musl --for x86_64-unknown-linux-gnu
          else
            echo "=== Building x86_64 with gnu target ==="
            cargo run -p rim_dev -- dist --cli -b --for x86_64-unknown-linux-gnu
          fi

          echo "=== Building aarch64 with gnu target ==="
          cargo run -p rim_dev -- dist --cli -b --target aarch64-unknown-linux-gnu --for aarch64-unknown-linux-gnu

      - name: Validate and list build artifacts
        run: |
          set -e
          cd repo_workspace
          ls -al dist || true
          ls -al dist/x86_64-unknown-linux-gnu || true
          ls -al dist/aarch64-unknown-linux-gnu || true
          test -d dist/x86_64-unknown-linux-gnu
          test -d dist/aarch64-unknown-linux-gnu
          find dist/x86_64-unknown-linux-gnu -maxdepth 2 -type f -print
          find dist/aarch64-unknown-linux-gnu -maxdepth 2 -type f -print

      - name: Install Python dependencies for release script
        run: |
          set -e
          pip3 install --quiet httpx

      - name: Upload to GitCode Release
        run: |
          set -euo pipefail
          cd repo_workspace

          ACCESS_TOKEN="5yyPyAvBcv2UVTog37nEe378"

          RELEASE_TAG="dev"
          OWNER="xuanwu"
          REPO="custom-rust-dist"
          export GITCODE_TOKEN="$ACCESS_TOKEN"
          export GITCODE_OWNER="$OWNER"
          export GITCODE_REPO="$REPO"

          echo "=== Step 1: Create release and upload artifacts ==="
          FILE_ARGS=""
          for UPLOAD_DIR in dist/x86_64-unknown-linux-gnu dist/aarch64-unknown-linux-gnu; do
            if [ ! -d "$UPLOAD_DIR" ]; then
              echo "WARN: upload directory not found: $UPLOAD_DIR"
              continue
            fi

            while IFS= read -r file; do
              [ -n "$file" ] || continue
              FILE_ARGS="$FILE_ARGS \"$file\""
            done <<FIND_EOF
          $(find "$UPLOAD_DIR" -maxdepth 1 -type f | sort)
          FIND_EOF
          done

          if [ -z "$FILE_ARGS" ]; then
            echo "ERROR: no artifacts found to upload"
            exit 1
          fi

          eval "python3 .gitcode/workflows/release.py --tag ${RELEASE_TAG} --name ${RELEASE_TAG} --body \"Auto release from linux-build CI\" --files $FILE_ARGS"
