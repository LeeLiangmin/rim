name: Linux CLI Build

on:
  push:
    branches: [ "llm" ]
  pull_request:
    branches: [ "llm" ]

jobs:
  build-cli:
    runs-on: euleros-2.10.1

    env:
      EDITION: community
      REPO_DIR: repo_workspace

    steps:
      - uses: checkout-action@0.0.1

      - name: Setup Node.js
        uses: setup-node@0.0.1
        with:
          node-version: '20.10.0'

      - name: Check system
        run: |
          uname -a
          cat /etc/os-release

      - name: Install system dependencies
        run: |
          if command -v dnf >/dev/null 2>&1; then
            dnf install -y gcc gcc-c++ make perl pkgconfig openssl-devel xz-devel curl wget || echo "WARN: dnf install failed, continue with preinstalled tools"
          elif command -v yum >/dev/null 2>&1; then
            yum install -y gcc gcc-c++ make perl pkgconfig openssl-devel xz-devel curl wget || echo "WARN: yum install failed, continue with preinstalled tools"
          else
            echo "WARN: no supported package manager found, continue with preinstalled tools"
          fi

      - name: Verify dependencies
        run: |
          echo "=== C compiler ==="
          gcc --version || echo "FAIL: no gcc"
          echo "=== make ==="
          make --version || echo "FAIL: no make"
          echo "=== perl ==="
          perl --version || echo "FAIL: no perl"
          echo "=== pkg-config ==="
          pkg-config --version || echo "FAIL: no pkg-config"
          echo "=== openssl ==="
          pkg-config --exists openssl && echo "openssl OK" || echo "WARN: openssl not found via pkg-config"
          echo "=== node ==="
          node --version
          npm --version

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          . "$HOME/.cargo/env"
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-unknown-linux-musl || echo "WARN: musl target add failed"
          rustc --version
          cargo --version

      - name: Build CLI
        run: |
          . "$HOME/.cargo/env"
          cd "$REPO_DIR"
          cargo dev --help >/dev/null
          if command -v musl-gcc >/dev/null 2>&1; then
            echo "=== Building with musl target ==="
            cargo dev dist --cli -b --target x86_64-unknown-linux-musl --for x86_64-unknown-linux-gnu
          else
            echo "=== Building with gnu target ==="
            cargo dev dist --cli -b --for x86_64-unknown-linux-gnu
          fi

      - name: Validate and list build artifacts
        run: |
          cd "$REPO_DIR"
          test -d dist
          find dist -maxdepth 3 -type f -print
