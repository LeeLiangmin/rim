name: Environment Probe

on:
  push:
    branches: ["master"]
  workflow_dispatch:

jobs:
  probe:
    runs-on: euleros-2.10.1
    steps:
      - uses: checkout-action@0.0.1
      - name: OS & Kernel
        run: |
          echo "::group::OS Release"
          cat /etc/os-release || true
          echo "::endgroup::"
          echo "::group::Kernel & Arch"
          uname -a
          echo "::endgroup::"
          echo "::group::glibc"
          /lib64/libc.so.6 2>&1 || true
          ldd --version 2>&1 | head -3 || true
          echo "::endgroup::"
          echo "::group::CPU"
          nproc
          cat /proc/cpuinfo | grep -E 'model name|processor' | head -10 || true
          echo "::endgroup::"
          echo "::group::Memory"
          free -h || true
          echo "::endgroup::"
          echo "::group::Disk"
          df -h / /home /tmp 2>/dev/null || true
          echo "::endgroup::"

      - name: System Packages
        run: |
          echo "::group::RPM Packages"
          rpm -qa 2>/dev/null | sort | head -200 || true
          echo "::endgroup::"
          echo "::group::Available Repos"
          yum repolist 2>/dev/null || dnf repolist 2>/dev/null || true
          echo "::endgroup::"

      - name: Toolchain Versions
        run: |
          echo "::group::gcc"
          gcc --version 2>&1 | head -2 || echo "  not found"
          g++ --version 2>&1 | head -2 || echo "  not found"
          echo "::endgroup::"
          echo "::group::make & build tools"
          make --version 2>&1 | head -1 || echo "  not found"
          cmake --version 2>&1 | head -1 || echo "  not found"
          pkg-config --version 2>&1 || echo "  not found"
          echo "::endgroup::"
          echo "::group::python"
          python3 --version 2>&1 || echo "  not found"
          pip3 --version 2>&1 || echo "  not found"
          echo "::endgroup::"
          echo "::group::node & pnpm"
          node --version 2>&1 || echo "  not found"
          npm --version 2>&1 || echo "  not found"
          pnpm --version 2>&1 || echo "  not found"
          echo "::endgroup::"
          echo "::group::git"
          git --version 2>&1 || echo "  not found"
          echo "::endgroup::"
          echo "::group::curl & wget"
          curl --version 2>&1 | head -1 || echo "  not found"
          wget --version 2>&1 | head -1 || echo "  not found"
          echo "::endgroup::"
          echo "::group::docker"
          docker --version 2>&1 || echo "  not found"
          echo "::endgroup::"

      - name: Network Connectivity
        run: |
          echo "::group::DNS"
          cat /etc/resolv.conf 2>/dev/null || true
          echo "::endgroup::"
          echo "::group::Mirror Reachability"
          for url in \
            "https://mirror.xuanwu.openatom.cn" \
            "https://xuanwu-rust.obs.cn-north-4.myhuaweicloud.com/dist/" \
            "https://mirrors.tuna.tsinghua.edu.cn" \
            "https://mirrors.ustc.edu.cn" \
            "https://github.com" \
            "https://api.gitcode.com/api/v5"; do
            echo -n "  $url ... "
            curl -sSI --connect-timeout 5 --max-time 10 "$url" 2>/dev/null | head -1 || echo "UNREACHABLE"
          done
          echo "::endgroup::"
          echo "::group::OBS file access"
          for f in \
            "https://xuanwu-rust.obs.cn-north-4.myhuaweicloud.com/dist/mingw-w64-cross.tar.xz" \
            "https://xuanwu-rust.obs.cn-north-4.myhuaweicloud.com/dist/arm-gnu-toolchain-13.3.rel1-x86_64-aarch64-none-linux-gnu.tar.xz" \
            "https://xuanwu-rust.obs.cn-north-4.myhuaweicloud.com/dist/llvm-dlltool-x86_64-linux"; do
            echo -n "  $(basename $f) ... "
            curl -sSI --connect-timeout 5 --max-time 10 "$f" 2>/dev/null | grep -E 'HTTP|Content-Length' || echo "UNREACHABLE"
          done
          echo "::endgroup::"

      - name: Cross-compile Tools
        run: |
          echo "::group::mingw-w64"
          echo -n "  x86_64-w64-mingw32-gcc: "
          command -v x86_64-w64-mingw32-gcc 2>/dev/null || echo "not found"
          echo -n "  x86_64-w64-mingw32-dlltool: "
          command -v x86_64-w64-mingw32-dlltool 2>/dev/null || echo "not found"
          echo -n "  llvm-dlltool: "
          command -v llvm-dlltool 2>/dev/null || echo "not found"
          echo "::endgroup::"
          echo "::group::aarch64"
          echo -n "  aarch64-linux-gnu-gcc: "
          command -v aarch64-linux-gnu-gcc 2>/dev/null || echo "not found"
          echo "::endgroup::"
          echo "::group::musl"
          echo -n "  musl-gcc: "
          command -v musl-gcc 2>/dev/null || echo "not found"
          echo "::endgroup::"

      - name: Fix yum/dnf (python3 shebang)
        run: |
          echo "::group::Python3 identity"
          echo -n "  path: "; command -v python3
          echo -n "  real: "; python3 -c "import sys; print(sys.executable)"
          python3 -c "import sys; print('  abi:', sys.abiflags); print('  version_info:', sys.version_info[:3])"
          echo "::endgroup::"

          echo "::group::Search for system python3.7 binary"
          for p in /usr/bin/python3.7 /usr/bin/python37 /usr/bin/python3; do
            if [ -x "$p" ]; then
              echo "  $p: EXISTS ($($p --version 2>&1))"
            else
              echo "  $p: not found"
            fi
          done
          echo "::endgroup::"

          echo "::group::All python3.7 site-packages"
          find /usr -path "*/python3.7/site-packages" -type d 2>/dev/null
          echo "---"
          echo "  libdnf location:"
          find /usr -name "libdnf*" -type f 2>/dev/null | head -20
          echo "---"
          echo "  rpm location:"
          find /usr -path "*/site-packages/rpm" -maxdepth 5 -type d 2>/dev/null
          echo "::endgroup::"

          echo "::group::Attempt fix: full PYTHONPATH (lib + lib64)"
          PY37_LIB="/usr/lib/python3.7/site-packages"
          PY37_LIB64="/usr/lib64/python3.7/site-packages"
          PY37_PATHS=""
          for d in "$PY37_LIB" "$PY37_LIB64"; do
            [ -d "$d" ] && PY37_PATHS="$PY37_PATHS:$d"
          done
          PY37_PATHS="${PY37_PATHS#:}"
          echo "  PYTHONPATH=$PY37_PATHS"
          if [ -n "$PY37_PATHS" ]; then
            PYTHONPATH="$PY37_PATHS" python3 /bin/yum --version 2>&1 | head -5
          fi
          echo "::endgroup::"

          echo "::group::Attempt fix: use python3.7 if available"
          PY37_BIN=""
          for p in /usr/bin/python3.7 /usr/bin/python37; do
            [ -x "$p" ] && PY37_BIN="$p" && break
          done
          if [ -n "$PY37_BIN" ]; then
            echo "  using $PY37_BIN to call yum"
            $PY37_BIN /bin/yum --version 2>&1 | head -5
          else
            echo "  no python3.7 binary found"
          fi
          echo "::endgroup::"

      - name: Install Docker (yum)
        run: |
          echo "::group::Install Docker"
          PY37_PATHS="/usr/lib/python3.7/site-packages"
          [ -d "/usr/lib64/python3.7/site-packages" ] && PY37_PATHS="$PY37_PATHS:/usr/lib64/python3.7/site-packages"

          YUM_OK=false

          # attempt 1: use python3.7 binary directly
          PY37_BIN=""
          for p in /usr/bin/python3.7 /usr/bin/python37; do
            [ -x "$p" ] && PY37_BIN="$p" && break
          done
          if [ -n "$PY37_BIN" ]; then
            echo "  using $PY37_BIN /bin/yum"
            $PY37_BIN /bin/yum install -y docker docker-engine 2>&1 | head -20 && YUM_OK=true
          fi

          # attempt 2: PYTHONPATH with full paths on python3.8
          if [ "$YUM_OK" = false ]; then
            echo "  using PYTHONPATH=$PY37_PATHS python3 /bin/yum"
            PYTHONPATH="$PY37_PATHS" python3 /bin/yum install -y docker docker-engine 2>&1 | head -20 && YUM_OK=true
          fi

          if [ "$YUM_OK" = false ]; then
            echo "  yum/dnf still broken — cannot install docker"
          fi
          echo "::endgroup::"
          echo "::group::Post-install Check"
          echo -n "  docker: "
          command -v docker 2>/dev/null || echo "NOT FOUND"
          echo "::endgroup::"

      - name: Docker Build Test
        run: |
          echo "::group::docker build"
          docker build . --file ci/docker/dist-x86-64-linux/Dockerfile --tag custom-rust-dist:test 2>&1 || echo "  BUILD FAILED"
          echo "::endgroup::"

      - name: Docker Socket & Env
        run: |
          echo "::group::Socket"
          for p in /var/run/docker.sock /run/docker.sock; do
            if [ -e "$p" ]; then
              echo "  $p: EXISTS ($(ls -la "$p" 2>/dev/null | awk '{print $1, $3, $4}'))"
            else
              echo "  $p: not found"
            fi
          done
          echo "::endgroup::"
          echo "::group::Docker Info"
          docker --version 2>&1 || echo "  docker --version failed"
          docker info 2>&1 | head -20 || echo "  docker info failed"
          echo "::endgroup::"

      - name: Filesystem Layout
        run: |
          echo "::group::Home"
          echo "  HOME=$HOME"
          ls -la "$HOME/" 2>/dev/null || true
          echo "::endgroup::"
          echo "::group::Workspace"
          echo "  PWD=$(pwd)"
          ls -la /data/workspace/ 2>/dev/null | head -20 || true
          echo "::endgroup::"
          echo "::group::PATH"
          echo "$PATH" | tr ':' '\n'
          echo "::endgroup::"
          echo "::group::Env Vars"
          env | sort | grep -v -E 'TOKEN|SECRET|PASSWORD|KEY|AUTH' | head -80 || true
          echo "::endgroup::"
