name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - v*.*.*

jobs:
  linux-x86_64:
    name: Build and Release Linux x86_64
    runs-on: euleros-latest

    steps:
      - uses: checkout-action@0.0.1

      - name: Load shared config
        run: |
          set -e
          cd repo_workspace
          set -a; source .gitcode/workflows/.env; set +a

      - name: Install dependencies
        run: |
          set -e
          cd repo_workspace
          bash .gitcode/workflows/scripts/euleros-install-deps.sh --linux-gui

      - name: Build
        run: |
          set -e
          cd repo_workspace
          bash .gitcode/workflows/scripts/build-target.sh \
            --build-target "$BUILD_TARGET_X86_64" \
            --dist-targets "$DIST_TARGETS_X86_64"

      - name: Upload to GitCode Release
        run: |
          set -e
          cd repo_workspace
          RELEASE_TAG="${CI_COMMIT_TAG:-$DEFAULT_RELEASE_TAG}"
          bash .gitcode/workflows/scripts/upload-gitcode-release.sh \
            --tag "$RELEASE_TAG" \
            --dist-dir "dist/$DIST_TARGETS_X86_64"

  linux-aarch64:
    name: Build and Release Linux aarch64
    runs-on: euleros-aarch64-latest

    steps:
      - uses: checkout-action@0.0.1

      - name: Load shared config
        run: |
          set -e
          cd repo_workspace
          set -a; source .gitcode/workflows/.env; set +a

      - name: Install dependencies
        run: |
          set -e
          cd repo_workspace
          bash .gitcode/workflows/scripts/euleros-install-deps.sh --linux-gui

      - name: Build
        run: |
          set -e
          cd repo_workspace
          bash .gitcode/workflows/scripts/build-target.sh \
            --build-target "$BUILD_TARGET_AARCH64" \
            --dist-targets "$DIST_TARGETS_AARCH64"

      - name: Upload to GitCode Release
        run: |
          set -e
          cd repo_workspace
          RELEASE_TAG="${CI_COMMIT_TAG:-$DEFAULT_RELEASE_TAG}"
          bash .gitcode/workflows/scripts/upload-gitcode-release.sh \
            --tag "$RELEASE_TAG" \
            --dist-dir "dist/$DIST_TARGETS_AARCH64"

  windows-gnu:
    name: Build and Release Windows (mingw cross)
    runs-on: euleros-latest

    steps:
      - uses: checkout-action@0.0.1

      - name: Load shared config
        run: |
          set -e
          cd repo_workspace
          set -a; source .gitcode/workflows/.env; set +a

      - name: Install dependencies
        run: |
          set -e
          cd repo_workspace
          bash .gitcode/workflows/scripts/euleros-install-deps.sh --windows-cross

      - name: Build
        run: |
          set -e
          cd repo_workspace
          bash .gitcode/workflows/scripts/build-target.sh \
            --build-target "$BUILD_TARGET_WINDOWS" \
            --dist-targets "$DIST_TARGETS_WINDOWS" \
            --skip-gui

      - name: Upload to GitCode Release
        run: |
          set -e
          cd repo_workspace
          RELEASE_TAG="${CI_COMMIT_TAG:-$DEFAULT_RELEASE_TAG}"
          bash .gitcode/workflows/scripts/upload-gitcode-release.sh \
            --tag "$RELEASE_TAG" \
            --dist-dir "dist/${DIST_TARGETS_WINDOWS%%,*}"
