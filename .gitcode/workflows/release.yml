  #     - name: Build
  #       run: cd repo_workspace && bash -c 'source .gitcode/.env && bash .gitcode/scripts/build-target.sh --build-target "$BUILD_TARGET_WINDOWS" --dist-targets "$DIST_TARGETS_WINDOWS" --skip-gui'
