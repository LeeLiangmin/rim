name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - v*.*.*

jobs:
  linux-x86-64:
    runs-on: ubuntu:latest
    steps:
      - uses: checkout-action@0.0.1
      - name: Install deps
        run: cd repo_workspace && bash .gitcode/scripts/euleros-install-deps.sh --linux-gui
      - name: Build
        run: cd repo_workspace && bash -c 'source .gitcode/.env && bash .gitcode/scripts/build-target.sh --build-target "$BUILD_TARGET_X86_64" --dist-targets "$DIST_TARGETS_X86_64"'
      - name: Upload
        run: cd repo_workspace && bash -c 'source .gitcode/.env && bash .gitcode/scripts/upload-gitcode-release.sh --tag "${CI_COMMIT_TAG:-$DEFAULT_RELEASE_TAG}" --dist-dir "dist/$DIST_TARGETS_X86_64"'

  linux-aarch64:
    runs-on: ubuntu:latest
    steps:
      - uses: checkout-action@0.0.1
      - name: Install deps
        run: cd repo_workspace && bash .gitcode/scripts/euleros-install-deps.sh --linux-gui
      - name: Build
        run: cd repo_workspace && bash -c 'source .gitcode/.env && bash .gitcode/scripts/build-target.sh --build-target "$BUILD_TARGET_AARCH64" --dist-targets "$DIST_TARGETS_AARCH64"'
      - name: Upload
        run: cd repo_workspace && bash -c 'source .gitcode/.env && bash .gitcode/scripts/upload-gitcode-release.sh --tag "${CI_COMMIT_TAG:-$DEFAULT_RELEASE_TAG}" --dist-dir "dist/$DIST_TARGETS_AARCH64"'

  # windows-gnu: disabled - requires compatible dlltool for Rust raw-dylib feature
  # TODO: re-enable when CI runner has newer glibc or native Windows runner available
